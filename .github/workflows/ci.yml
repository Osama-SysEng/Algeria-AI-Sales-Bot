name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r Algeria-AI-Sales-Bot/app/algeria-ai-sales-bot/requirements.txt
      - name: Run tests
        run: cd Algeria-AI-Sales-Bot/app/algeria-ai-sales-bot && python -m pytest backend/tests -q
